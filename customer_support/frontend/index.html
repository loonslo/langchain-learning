<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业客服知识库助手</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --user-bubble: #1d4ed8;
      --bot-bubble: #334155;
      --border: #334155;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--danger); transition: background .3s;
    }
    .status-dot.ok { background: #22c55e; }
    .status-text { font-size: 12px; color: var(--muted); }
    .spacer { flex: 1; }
    .btn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .btn:hover { border-color: var(--accent); }
    main {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg { max-width: 78%; padding: 12px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
    .msg.bot .sources {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
      font-size: 12px; color: var(--muted);
    }
    .msg.bot .sources b { color: var(--accent); font-weight: 600; }
    .msg.bot .ticket { margin-top: 6px; font-size: 12px; color: #fbbf24; }
    .msg.error { background: #7f1d1d; border: 1px solid var(--danger); }
    footer {
      padding: 14px 20px; background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; height: 48px; padding: 12px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 14px; line-height: 1.4;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .send {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #03121f; border: none; font-weight: 700;
      padding: 0 22px; height: 48px; border-radius: 10px; cursor: pointer; font-size: 14px;
    }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .order-row { display: flex; gap: 8px; padding: 0 20px 6px; }
    .order-row input {
      flex: 1; padding: 8px 10px; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    }
    .typing { font-style: italic; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="status-dot"></span>
    <span class="status-text" id="status">连接中…</span>
    <h1>企业客服知识库助手</h1>
    <div class="spacer"></div>
    <button class="btn" id="retryConn">重试连接</button>
    <button class="btn" id="newChat">新会话</button>
  </header>

  <main id="chat"></main>

  <div class="order-row">
    <input id="orderId" placeholder="可选：填入订单号进入订单查询分支（如 ORD-1001）" />
  </div>

  <footer>
    <textarea id="input" placeholder="输入问题，回车发送（Shift+Enter 换行）…"></textarea>
    <button class="send" id="send">发送</button>
  </footer>

  <script>
    const API_BASE = "http://127.0.0.1:19100";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const dotEl = document.getElementById("dot");
    const statusEl = document.getElementById("status");
    const orderEl = document.getElementById("orderId");

    let sessionId = "sess-" + Math.random().toString(36).slice(2, 10);

    function setStatus(ok, text) {
      dotEl.className = "status-dot" + (ok ? " ok" : "");
      statusEl.textContent = text;
    }

    function addMessage(role, text, sources, ticketId) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      if (role === "bot" && sources && sources.length) {
        const s = document.createElement("div");
        s.className = "sources";
        s.innerHTML = "<b>来源：</b>" + sources.map(escapeHtml).join("、");
        el.appendChild(s);
      }
      if (role === "bot" && ticketId) {
        const t = document.createElement("div");
        t.className = "ticket";
        t.textContent = "已为您生成工单：" + ticketId;
        el.appendChild(t);
      }
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function checkHealth() {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 4000);
        const r = await fetch(API_BASE + "/health", { cache: "no-store", signal: ctrl.signal });
        clearTimeout(t);
        if (r.ok) { setStatus(true, "已连接 · " + API_BASE); return true; }
        setStatus(false, "后端返回 " + r.status + "，请检查服务是否就绪");
      } catch (e) {
        let reason = e.name === "AbortError" ? "请求超时(4s)" : e.message;
        setStatus(false, "未连接：(" + reason + ") 目标 " + API_BASE + "/health");
      }
      return false;
    }

    async function send() {
      const q = inputEl.value.trim();
      if (!q) return;
      if (!(await checkHealth())) return;

      addMessage("user", q);
      inputEl.value = "";
      sendEl.disabled = true;
      const typing = addMessage("bot", "正在思考…", null, null);
      typing.classList.add("typing");

      try {
        const r = await fetch(API_BASE + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: q,
            session_id: sessionId,
            order_id: orderEl.value.trim(),
          }),
        });
        const data = await r.json();
        chatEl.removeChild(typing);
        if (r.ok) {
          addMessage("bot", data.answer, data.sources || [], data.ticket_id);
        } else {
          const m = addMessage("bot", "请求失败：" + (data.detail || r.status), null, null);
          m.classList.add("error");
        }
      } catch (e) {
        chatEl.removeChild(typing);
        const m = addMessage("bot", "网络错误：" + e.message, null, null);
        m.classList.add("error");
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    document.getElementById("newChat").addEventListener("click", () => {
      sessionId = "sess-" + Math.random().toString(36).slice(2, 10);
      chatEl.innerHTML = "";
      orderEl.value = "";
      setStatus(true, "已开启新会话");
    });
    document.getElementById("retryConn").addEventListener("click", () => {
      setStatus(false, "连接中…");
      checkHealth();
    });

    checkHealth();
    inputEl.focus();
  </script>
</body>
</html>
