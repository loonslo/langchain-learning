services:
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    environment:
      MODEL_ID: ${MODEL_ID:?set MODEL_ID}
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
    command:
      - "${MODEL_ID}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.9}"
      - "--api-key"
      - "${VLLM_API_KEY}"
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
