name: capstone-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capstone-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify unified project baseline
        run: |
          cd day51
          PYTHONPATH=src python -m customer_support.cli --check-data
          python -m pytest -q
          cd ..
          python -m capstone.project_baseline --json

      - name: Run deterministic production-boundary tests
        run: pytest capstone/test_production.py -q

      - name: Run authenticated API load-test smoke
        env:
          SLO_P95_MS: "2000"
          SLO_ERROR_PCT: "1"
          SLO_MIN_RPS: "1"
        run: python -m capstone.load_test --fake --users 2 --spawn-rate 2 --time 5s --upstream-ms 50

      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence
          path: reports/loadtest_*.json
          if-no-files-found: warn

  live-model-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run actual-service regression
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMBED_MODEL_PATH: BAAI/bge-small-zh-v1.5
        run: pytest capstone/test_regression.py -v

      - name: Run versioned quality gate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMBED_MODEL_PATH: BAAI/bge-small-zh-v1.5
        run: python -m capstone.ci_gate

      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-report
          path: |
            capstone/data/eval_report.md
            capstone/data/failures.json
          if-no-files-found: warn
