[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "customer-support-assistant"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = ["langchain-chroma>=1.1,<2","langchain-community>=0.4,<1","langchain-core>=1.4,<2","langchain-huggingface>=1.2,<2","langchain-ollama>=1.1,<2","langchain-openai>=1.3,<2","langchain-text-splitters>=1.1,<2","langgraph>=1.2,<2","python-dotenv>=1.2,<2"]
[project.scripts]
support-assistant = "customer_support.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
