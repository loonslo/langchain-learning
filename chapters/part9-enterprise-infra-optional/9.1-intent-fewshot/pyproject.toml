[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-support-course"
version = "0.1.0"
description = "章节 9.1–10.4：企业客服 Agent 进阶课程"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "qdrant-client>=1.12,<2",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
